# z80em86 (PC-8801 風 Z80) 用。Z80 の速度は z80em86 が 4MHz に調整するので、
# DOSBox-X 側は全速 (cycles=max) で動かす。DOS 内で set Z80SPEED=8 / 0 で変更できる
[cpu]
core=normal
cputype=8086
cycles=max

# 日本語キーボード (JP106) の配列にする。keyboardlayout=jp だとコードページが
# 932 (日本語フォント、\ が ¥ になる) に変わるので、437 (英語フォント) を指定する
[autoexec]
keyb jp 437
